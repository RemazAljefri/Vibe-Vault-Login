<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <!-- Banner and Header Section -->
    <header>
        <img src="assets/img/1.jpeg" alt="image">
        <h1 class="text">Vibe Vault</h1>
        <p class="text">Sign in to discover the latest Y2K & Grunge trends and explore our exclusive collections.</p>
    </header>

    <!-- Login Card Container -->
    <div class="container">
        <form action="" class="Login">

            <!-- Input Fields -->
            <div class="inputs">
                <i class="fa-regular fa-envelope"></i>
                <input placeholder="email or tel" type="text">
                <br>
                <i class="fa-solid fa-lock"></i>
                <input placeholder="password" type="password">
            </div>

            <!-- Buttons and Links -->
            <div class="buttons">
                <button>Login</button>
                <br>
                <a href="">Forgot your password?</a>
                <br>
                <hr>
                <button>Create new account</button>
                <br>
                <a href="">Log in as Administrator</a>
            </div>

        </form>
    </div>

</body>
</html>
